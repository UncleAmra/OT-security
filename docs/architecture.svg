<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#0d1117"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">OT Power Plant Testbed — Purdue Layer Architecture</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#8b949e">Host-only virtual network · all inter-layer traffic is plain Modbus/TCP or HTTP (interceptable)</text>

  <!-- Operator browser -->
  <rect x="40" y="92" width="200" height="60" rx="4" fill="#161b22" stroke="#6e7681" stroke-dasharray="5 4"/>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Operator browser</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#8b949e">P&amp;ID dashboard</text>

  <!-- Layer 3 -->
  <rect x="300" y="84" width="420" height="130" rx="4" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="320" y="112" font-size="16" font-weight="700" fill="#e6edf3">Layer 3 · SCADA / HMI</text>
  <text x="700" y="112" text-anchor="end" font-size="12" fill="#8b949e">Host machine · scada_hmi</text>
  <text x="320" y="138" font-size="13" fill="#c9d1d9">• ScadaPoller: reads all 64 registers from PLC at 4 Hz</text>
  <text x="320" y="160" font-size="13" fill="#c9d1d9">• HTTP server :8085 — /api/telemetry, /api/command</text>
  <text x="320" y="182" font-size="13" fill="#c9d1d9">• Operator commands → single-register writes (FC06)</text>
  <text x="320" y="202" font-size="12" fill="#8b949e">serves web/ (index.html, app.js, style.css)</text>

  <line x1="240" y1="122" x2="298" y2="122" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="269" y="112" text-anchor="middle" font-size="11" fill="#8b949e">HTTP</text>

  <!-- L3 <-> L2 link -->
  <line x1="510" y1="216" x2="510" y2="282" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="524" y="232" width="250" height="36" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="536" y="248" font-size="12" font-weight="600" fill="#e6edf3">Modbus/TCP → PLC:5020</text>
  <text x="536" y="262" font-size="11" fill="#8b949e">FC03 read telemetry · FC06 write commands</text>

  <!-- Layer 2 -->
  <rect x="300" y="284" width="420" height="150" rx="4" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="320" y="312" font-size="16" font-weight="700" fill="#e6edf3">Layer 2 · Soft PLC</text>
  <text x="700" y="312" text-anchor="end" font-size="12" fill="#8b949e">VM B · plc_controller</text>
  <text x="320" y="338" font-size="13" fill="#c9d1d9">• Modbus/TCP server on 0.0.0.0:5020 (64 holding registers)</text>
  <text x="320" y="360" font-size="13" fill="#c9d1d9">• 10 Hz scan: input → PID / startup sequence → SIS → output</text>
  <text x="320" y="382" font-size="13" fill="#c9d1d9">• Drum-level, turbine speed/load and draft PID loops</text>
  <text x="320" y="404" font-size="13" fill="#c9d1d9">• SIS trips: MFT, turbine ETS, ESD, first-out latch</text>
  <text x="320" y="424" font-size="12" fill="#8b949e">central hub — the only server; every other node is a client</text>

  <!-- L1 <-> L2 link -->
  <line x1="510" y1="436" x2="510" y2="502" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="524" y="452" width="236" height="36" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="536" y="468" font-size="12" font-weight="600" fill="#e6edf3">Modbus/TCP → PLC:5020 · 2 Hz</text>
  <text x="536" y="482" font-size="11" fill="#8b949e">FC03 read actuators · FC16 write sensors</text>

  <!-- Layer 1 -->
  <rect x="300" y="504" width="420" height="150" rx="4" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
  <text x="320" y="532" font-size="16" font-weight="700" fill="#e6edf3">Layer 1 · Physics Digital Twin</text>
  <text x="700" y="532" text-anchor="end" font-size="12" fill="#8b949e">VM A · physics_engine</text>
  <text x="320" y="558" font-size="13" fill="#c9d1d9">• Combustion &amp; draft → Boiler / steam drum</text>
  <text x="320" y="580" font-size="13" fill="#c9d1d9">• Steam turbine → Synchronous generator</text>
  <text x="320" y="602" font-size="13" fill="#c9d1d9">• Condenser &amp; feedwater (BFP A/B, CEP)</text>
  <text x="320" y="624" font-size="13" fill="#c9d1d9">• Steps coupled equations at 2 Hz</text>
  <text x="320" y="644" font-size="12" fill="#8b949e">acts as the "field": sensors + actuators</text>

  <!-- Layer 4 planned -->
  <rect x="770" y="300" width="170" height="210" rx="4" fill="#161b22" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="855" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Layer 4 · Security</text>
  <text x="855" y="346" text-anchor="middle" font-size="12" fill="#8b949e">VM C · planned</text>
  <text x="784" y="376" font-size="12" fill="#c9d1d9">• Packet capture on</text>
  <text x="796" y="392" font-size="12" fill="#c9d1d9">host-only network</text>
  <text x="784" y="416" font-size="12" fill="#c9d1d9">• Blue: ML anomaly</text>
  <text x="796" y="432" font-size="12" fill="#c9d1d9">detector + LLM agent</text>
  <text x="784" y="456" font-size="12" fill="#c9d1d9">• Red: Modbus spoofing</text>
  <text x="796" y="472" font-size="12" fill="#c9d1d9">/ injection agent</text>

  <line x1="768" y1="380" x2="722" y2="360" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="40" y="560" font-size="12" font-weight="700" fill="#e6edf3">Data flow</text>
  <text x="40" y="580" font-size="12" fill="#c9d1d9">L1 → PLC: sensor values</text>
  <text x="40" y="598" font-size="12" fill="#c9d1d9">PLC → L1: actuator outputs</text>
  <text x="40" y="616" font-size="12" fill="#c9d1d9">PLC → L3: telemetry</text>
  <text x="40" y="634" font-size="12" fill="#c9d1d9">L3 → PLC: operator commands</text>
  <text x="40" y="652" font-size="12" fill="#c9d1d9">L1 and L3 never talk directly</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">OT Power Plant Testbed — Purdue Layer Architecture</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">Host-only virtual network · all inter-layer traffic is plain Modbus/TCP or HTTP (interceptable)</text>

  <!-- Operator browser -->
  <rect x="40" y="92" width="200" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Operator browser</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#64748b">P&amp;ID dashboard</text>

  <!-- Layer 3 -->
  <rect x="300" y="84" width="420" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="112" font-size="16" font-weight="700" fill="#5b21b6">Layer 3 · SCADA / HMI</text>
  <text x="700" y="112" text-anchor="end" font-size="12" fill="#7c3aed">Host machine · scada_hmi</text>
  <text x="320" y="138" font-size="13" fill="#334155">• ScadaPoller: reads all 64 registers from PLC at 4 Hz</text>
  <text x="320" y="160" font-size="13" fill="#334155">• HTTP server :8085 — /api/telemetry, /api/command</text>
  <text x="320" y="182" font-size="13" fill="#334155">• Operator commands → single-register writes (FC06)</text>
  <text x="320" y="202" font-size="12" fill="#64748b">serves web/ (index.html, app.js, style.css)</text>

  <line x1="240" y1="122" x2="298" y2="122" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="269" y="112" text-anchor="middle" font-size="11" fill="#475569">HTTP</text>

  <!-- L3 <-> L2 link -->
  <line x1="510" y1="216" x2="510" y2="282" stroke="#475569" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="524" y="232" width="250" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="536" y="248" font-size="12" font-weight="600" fill="#0f172a">Modbus/TCP → PLC:5020</text>
  <text x="536" y="262" font-size="11" fill="#64748b">FC03 read telemetry · FC06 write commands</text>

  <!-- Layer 2 -->
  <rect x="300" y="284" width="420" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="312" font-size="16" font-weight="700" fill="#065f46">Layer 2 · Soft PLC</text>
  <text x="700" y="312" text-anchor="end" font-size="12" fill="#059669">VM B · plc_controller</text>
  <text x="320" y="338" font-size="13" fill="#334155">• Modbus/TCP server on 0.0.0.0:5020 (64 holding registers)</text>
  <text x="320" y="360" font-size="13" fill="#334155">• 10 Hz scan: input → PID / startup sequence → SIS → output</text>
  <text x="320" y="382" font-size="13" fill="#334155">• Drum-level, turbine speed/load and draft PID loops</text>
  <text x="320" y="404" font-size="13" fill="#334155">• SIS trips: MFT, turbine ETS, ESD, first-out latch</text>
  <text x="320" y="424" font-size="12" fill="#64748b">central hub — the only server; every other node is a client</text>

  <!-- L1 <-> L2 link -->
  <line x1="510" y1="436" x2="510" y2="502" stroke="#475569" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="524" y="452" width="236" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="536" y="468" font-size="12" font-weight="600" fill="#0f172a">Modbus/TCP → PLC:5020 · 2 Hz</text>
  <text x="536" y="482" font-size="11" fill="#64748b">FC03 read actuators · FC16 write sensors</text>

  <!-- Layer 1 -->
  <rect x="300" y="504" width="420" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="532" font-size="16" font-weight="700" fill="#1e40af">Layer 1 · Physics Digital Twin</text>
  <text x="700" y="532" text-anchor="end" font-size="12" fill="#2563eb">VM A · physics_engine</text>
  <text x="320" y="558" font-size="13" fill="#334155">• Combustion &amp; draft → Boiler / steam drum</text>
  <text x="320" y="580" font-size="13" fill="#334155">• Steam turbine → Synchronous generator</text>
  <text x="320" y="602" font-size="13" fill="#334155">• Condenser &amp; feedwater (BFP A/B, CEP)</text>
  <text x="320" y="624" font-size="13" fill="#334155">• Steps coupled equations at 2 Hz</text>
  <text x="320" y="644" font-size="12" fill="#64748b">acts as the "field": sensors + actuators</text>

  <!-- Layer 4 planned -->
  <rect x="770" y="300" width="170" height="210" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="855" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Layer 4 · Security</text>
  <text x="855" y="346" text-anchor="middle" font-size="12" fill="#dc2626">VM C · planned</text>
  <text x="784" y="376" font-size="12" fill="#334155">• Packet capture on</text>
  <text x="796" y="392" font-size="12" fill="#334155">host-only network</text>
  <text x="784" y="416" font-size="12" fill="#334155">• Blue: ML anomaly</text>
  <text x="796" y="432" font-size="12" fill="#334155">detector + LLM agent</text>
  <text x="784" y="456" font-size="12" fill="#334155">• Red: Modbus spoofing</text>
  <text x="796" y="472" font-size="12" fill="#334155">/ injection agent</text>

  <line x1="768" y1="380" x2="722" y2="360" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>

  <!-- Legend -->
  <text x="40" y="560" font-size="12" font-weight="700" fill="#0f172a">Data flow</text>
  <text x="40" y="580" font-size="12" fill="#334155">L1 → PLC: sensor values</text>
  <text x="40" y="598" font-size="12" fill="#334155">PLC → L1: actuator outputs</text>
  <text x="40" y="616" font-size="12" fill="#334155">PLC → L3: telemetry</text>
  <text x="40" y="634" font-size="12" fill="#334155">L3 → PLC: operator commands</text>
  <text x="40" y="652" font-size="12" fill="#334155">L1 and L3 never talk directly</text>
</svg>
